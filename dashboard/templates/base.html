<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #243047;
        }

        header {
            background: #1e293b;
            color: white;
            padding: 22px 8%;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        header p {
            margin: 8px 0 0;
            color: #cbd5e1;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 16px 8%;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }

        nav a {
            color: #334155;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #2563eb;
        }

        main {
            width: 84%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .welcome {
            margin-bottom: 28px;
        }

        .welcome h2 {
            margin-bottom: 8px;
            font-size: 28px;
        }

        .welcome p {
            color: #64748b;
            line-height: 1.6;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            padding: 24px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }

        .card h3 {
            margin-top: 0;
        }

        .card p {
            color: #64748b;
            line-height: 1.5;
        }

        .card a {
            display: inline-block;
            margin-top: 10px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            padding: 24px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }


        /* Form layout */
        .form-container {
            max-width: 650px;
            margin: 30px auto;
            padding: 28px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
        }

        .form-header {
            margin-bottom: 24px;
        }

        .form-header h2 {
            margin: 0 0 8px;
            color: #1e293b;
        }

        .form-header p {
            margin: 0;
            color: #64748b;
            line-height: 1.6;
        }

        .form-field {
            margin-bottom: 22px;
        }

        .form-field label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .form-field input,
        .form-field textarea,
        .form-field select {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #ffffff;
            color: #0f172a;
            font: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-field textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-field input:focus,
        .form-field textarea:focus,
        .form-field select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .form-field small {
            display: block;
            margin-top: 7px;
            color: #64748b;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .form-field ul.errorlist,
        form ul.errorlist {
            margin: 7px 0 0;
            padding: 0;
            list-style: none;
            color: #b91c1c;
            font-size: 0.875rem;
        }

        .form-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .form-actions button,
        .form-actions .button-primary {
            display: inline-block;
            padding: 11px 18px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: #ffffff;
            font: inherit;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .form-actions button:hover,
        .form-actions .button-primary:hover {
            background: #1d4ed8;
        }

        .form-actions .button-secondary {
            display: inline-block;
            padding: 10px 17px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #ffffff;
            color: #334155;
            font: inherit;
            text-decoration: none;
        }

        .form-actions .button-secondary:hover {
            background: #f1f5f9;
        }

        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 18px;
            margin: 24px 0;
        }

        .dashboard-card {
            padding: 22px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            background: #fff;
        }

        .dashboard-card h3 {
            margin-top: 0;
            font-size: 1rem;
        }

        .dashboard-number {
            margin: 14px 0;
            font-size: 2rem;
            font-weight: 700;
        }

        .dashboard-card a {
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .form-container {
                margin: 20px auto;
                padding: 20px;
            }

            .form-actions {
                align-items: stretch;
                flex-direction: column;
            }

            .form-actions button,
            .form-actions a {
                text-align: center;
            }
        }

        /* ===== Tables ===== */

        .table-container {
            width: 100%;
            overflow-x: auto;
            margin: 20px 0;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: left;
            font-size: 14px;
        }

        thead th {
            padding: 14px 16px;
            background: #f1f5f9;
            color: #334155;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            white-space: nowrap;
            border-bottom: 1px solid #e2e8f0;
        }

        tbody td {
            padding: 13px 16px;
            color: #475569;
            border-bottom: 1px solid #edf2f7;
            vertical-align: middle;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr {
            transition: background-color 0.15s ease;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        tbody td strong {
            color: #0f172a;
            font-weight: 600;
        }

        /* Keep action buttons aligned */
        .table-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .table-actions a,
        .table-actions button {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        /* Optional status labels */
        .status-badge {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .status-success {
            background: #dcfce7;
            color: #166534;
        }

        .status-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .status-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-neutral {
            background: #e2e8f0;
            color: #334155;
        }

        /*  Responsive tables */
        @media (max-width: 768px) {
            .table-container {
                margin: 14px 0;
                border-radius: 8px;
            }

            table {
                font-size: 13px;
            }

            thead th,
            tbody td {
                padding: 10px 12px;
            }
        }

        /* ===== Main Navigation ===== */

        .main-nav {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 14px 0;
            padding-left: 15px;
            padding-right: 15px;
        }

        .main-nav .nav-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 17px;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            background: #ffffff;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            transition:
                background-color 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        .main-nav .nav-link:hover {
            background: #eff6ff;
            color: #1d4ed8;
            border-color: #bfdbfe;
            box-shadow: 0 3px 8px rgba(37, 99, 235, 0.10);
            transform: translateY(-1px);
        }

        .main-nav .nav-link:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }

        /* Separate the Administration link visually */
        .main-nav .nav-link-admin {
            margin-left: auto;
            background: #f8fafc;
            border-color: #cbd5e1;
            color: #475569;
        }

        .main-nav .nav-link-admin:hover {
            background: #e2e8f0;
            color: #0f172a;
            border-color: #94a3b8;
        }


        /* Active navigation button */
        .main-nav .nav-link.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 3px 8px rgba(37, 99, 235, 0.18);
        }

        .main-nav .nav-link.active:hover {
            background: #1d4ed8;
            color: #ffffff;
            border-color: #1d4ed8;
        }

        /* Keep Administration distinct when it is active */
        .main-nav .nav-link-admin.active {
            background: #334155;
            color: #ffffff;
            border-color: #334155;
        }

        .main-nav .nav-link-admin.active:hover {
            background: #1e293b;
            border-color: #1e293b;
        }


        /* ===== Inventory Action Toolbar ===== */

        .inventory-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin: 20px 0;
        }

        .inventory-actions,
        .inventory-filters {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .action-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .action-button:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
            color: #0f172a;
            transform: translateY(-1px);
            box-shadow: 0 3px 7px rgba(15, 23, 42, 0.08);
        }

        .action-button:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 2px;
        }

        /* Primary action */
        .action-button-primary {
            background: #2563eb;
            border-color: #2563eb;
            color: #ffffff;
        }

        .action-button-primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
            color: #ffffff;
        }

        /* Low-stock filter */
        .action-button-filter {
            background: #fffbeb;
            border-color: #fcd34d;
            color: #92400e;
        }

        .action-button-filter:hover {
            background: #fef3c7;
            border-color: #f59e0b;
            color: #78350f;
        }

        /* Active low-stock filter */
        .action-button-filter.active-filter {
            background: #fff1f2;
            border-color: #fda4af;
            color: #9f1239;
        }

        .action-button-filter.active-filter:hover {
            background: #ffe4e6;
            border-color: #fb7185;
            color: #881337;
        }

        /* Mobile layout */
        @media (max-width: 700px) {
            .inventory-toolbar {
                align-items: stretch;
                flex-direction: column;
            }

            .inventory-actions,
            .inventory-filters {
                width: 100%;
            }

            .inventory-actions .action-button,
            .inventory-filters .action-button {
                flex: 1 1 auto;
            }
        }



    </style>
</head>
<body>
    <header>
        <h1>Workshop Manager</h1>
        <p>Workshop inventory and repair management</p>
    </header>

    <nav class="main-nav">
        <a
            class="nav-link {% if request.resolver_match.namespace == 'dashboard' %}active{% endif %}"
            href="{% url 'dashboard:home' %}">
            Dashboard
        </a>

        <a
            class="nav-link {% if request.resolver_match.namespace == 'inventory' %}active{% endif %}"
            href="{% url 'inventory:index' %}">
            Inventory
        </a>

        <a
            class="nav-link {% if request.resolver_match.namespace == 'maintenance' %}active{% endif %}"
            href="{% url 'maintenance:index' %}">
            Maintenance
        </a>

        <a
            class="nav-link {% if request.resolver_match.namespace == 'suppliers' %}active{% endif %}"
            href="{% url 'suppliers:index' %}">
            Suppliers
        </a>

        <a
            class="nav-link nav-link-admin {% if request.resolver_match.namespace == 'admin' %}active{% endif %}"
            href="{% url 'admin:index' %}">
            Administration
        </a>
    </nav>

    <main>

        {% if messages %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Workshop Manager</p>
    </footer>
</body>
</html>
